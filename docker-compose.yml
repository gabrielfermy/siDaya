services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: sidaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sidaya_dev
    ports:
      - "54350:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sidaya_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
