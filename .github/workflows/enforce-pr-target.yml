name: Enforce PR Branch Hierarchy

on:
  pull_request:
    branches:
      - main

jobs:
  validate-branch-hierarchy:
    name: Validate PR Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR targets main only from staging
        run: |
          HEAD_REF="${{ github.head_ref }}"
          BASE_REF="${{ github.base_ref }}"
          echo "Pull Request Source: $HEAD_REF -> Target: $BASE_REF"
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "staging" ]; then
            echo "::error::VIOLATION: Production branch 'main' can ONLY receive Pull Requests from 'staging'. Source '$HEAD_REF' is rejected."
            exit 1
          fi
          echo "Branch hierarchy policy satisfied: $HEAD_REF -> $BASE_REF"
