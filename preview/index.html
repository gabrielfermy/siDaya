  <link rel="stylesheet" href="/css/onboarding.css">

  <script>
    /* Synchronous Pre-Paint Auth State & Session Expiry Resolver (Zero FOUC Flash) */
    (function() {
      try {
        var hostname = window.location.hostname.toLowerCase();
        var isOps = hostname.startsWith('ops.') || hostname === 'ops.localhost';
        
        var mode = localStorage.getItem('sidaya_theme_mode') || 'system';
        var resolvedTheme = mode;
        if (mode === 'system') {
          resolvedTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolvedTheme);
        document.documentElement.setAttribute('data-theme-mode', mode);

        var now = Date.now();
        var hasOpsSession = false;
        var hasMerchantSession = false;

        // 1. Validate Operator Session Expiry
        var rawOps = localStorage.getItem('sidaya_operator_session');
        if (rawOps) {
          try {
            var opsObj = JSON.parse(rawOps);
            if (opsObj && opsObj.expiresAt && opsObj.expiresAt > now) {
              hasOpsSession = true;
            } else {
              localStorage.removeItem('sidaya_operator_session');
              sessionStorage.setItem('sidaya_session_expired_flag', '1');
            }
          } catch(e) { localStorage.removeItem('sidaya_operator_session'); }
        }

        // 2. Validate Merchant Session Expiry
        var rawMerchant = localStorage.getItem('sidaya_merchant_session');
        if (rawMerchant) {
          try {
            var merchObj = JSON.parse(rawMerchant);
            if (merchObj && merchObj.expiresAt && merchObj.expiresAt > now) {
              hasMerchantSession = true;
            } else {
              localStorage.removeItem('sidaya_merchant_session');
              sessionStorage.setItem('sidaya_session_expired_flag', '1');
            }
          } catch(e) { localStorage.removeItem('sidaya_merchant_session'); }
        }

        // 3. Preserve User's Intended Destination Route upon session expiry/unauthenticated landing
        var fullPath = window.location.pathname;
        var isLegalPath = ['/faq', '/terms', '/terms-and-conditions', '/refund', '/refund-policy', '/privacy', '/privacy-policy', '/contact', '/kontak', '/legal'].includes(fullPath);

        if (fullPath && fullPath !== '/' && fullPath !== '/dashboard' && !fullPath.includes('404') && !isLegalPath) {
          if ((isOps && !hasOpsSession) || (!isOps && !hasMerchantSession)) {
            sessionStorage.setItem('sidaya_intended_path', fullPath);
          }
        }

        // 4. Set Pre-paint Declarative State Classes
        if (isLegalPath) {
          var baseAuthClass = isOps 
            ? (hasOpsSession ? 'state-auth-ops' : 'state-unauth-ops')
            : (hasMerchantSession ? 'state-auth-merchant' : 'state-unauth-merchant');
          document.documentElement.className = baseAuthClass + ' is-legal-portal-page';
        } else if (isOps) {
          document.documentElement.className = hasOpsSession ? 'state-auth-ops' : 'state-unauth-ops';
        } else {
          document.documentElement.className = hasMerchantSession ? 'state-auth-merchant' : 'state-unauth-merchant';
          if (!hasMerchantSession) {
            if (fullPath === '/' || fullPath === '') {
              document.documentElement.classList.add('is-landing-page');
            } else if (fullPath === '/register') {
              document.documentElement.classList.add('is-register-page');
            }
          }
        }
      } catch (e) {}
    })();
  </script>
