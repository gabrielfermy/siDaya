<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SiDaya - Enterprise OS (Multi-Tenant, FIFO & Role Matrix)</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Modular Stylesheets (Zero God CSS) -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/modules.css">

  <script>
    /* Synchronous Pre-Paint Auth State & Theme Resolver (Zero FOUC Flash) */
    (function() {
      try {
        var hostname = window.location.hostname.toLowerCase();
        var path = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
        var isOps = hostname.startsWith('ops.') || path === 'telemetry' || path === 'fleet' || path === 'operators' || path === 'audit';
        
        var theme = localStorage.getItem('sidaya_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);

        var hasOpsSession = !!localStorage.getItem('sidaya_operator_session');
        var hasMerchantSession = !!localStorage.getItem('sidaya_merchant_session');

        if (isOps) {
          document.documentElement.className = hasOpsSession ? 'state-auth-ops' : 'state-unauth-ops';
        } else {
          document.documentElement.className = hasMerchantSession ? 'state-auth-merchant' : 'state-unauth-merchant';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Dynamic Mounting Roots -->
  <div id="auth-root"></div>
  <div id="modal-root"></div>
  <div id="toast-container"></div>
  <div id="app-root"></div>

  <!-- 1. Config & Data Entities -->
  <script src="/js/config/constants.js"></script>
  <script src="/js/config/roadmap.js"></script>
  <script src="/js/config/errors.js"></script>

  <!-- 2. Models & Reactive State Store -->
  <script src="/js/store/state.js"></script>
  <script src="/js/store/store.js"></script>
  <script src="/js/utils/formatters.js"></script>

  <!-- 3. Views Layer (Declarative MVC Renderers) -->
  <script src="/js/views/layout.view.js"></script>
  <script src="/js/views/auth.view.js"></script>
  <script src="/js/views/modals.view.js"></script>
  <script src="/js/views/dashboard.view.js"></script>
  <script src="/js/views/katalog.view.js"></script>
  <script src="/js/views/fifo.view.js"></script>
  <script src="/js/views/customers.view.js"></script>
  <script src="/js/views/pos.view.js"></script>
  <script src="/js/views/invoices.view.js"></script>
  <script src="/js/views/sj.view.js"></script>
  <script src="/js/views/piutang.view.js"></script>
  <script src="/js/views/users.view.js"></script>
  <script src="/js/views/roles.view.js"></script>
  <script src="/js/views/settings.view.js"></script>
  <script src="/js/views/operator.view.js"></script>
  <script src="/js/views/roadmap.view.js"></script>
  <script src="/js/views/error.view.js"></script>

  <!-- 4. Components & Helpers -->
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modals.js"></script>

  <!-- 5. Controllers Layer (Event Handlers & Action Dispatchers) -->
  <script src="/js/controllers/auth.controller.js"></script>
  <script src="/js/controllers/pos.controller.js"></script>
  <script src="/js/controllers/fifo.controller.js"></script>
  <script src="/js/controllers/customers.controller.js"></script>
  <script src="/js/controllers/roles.controller.js"></script>
  <script src="/js/controllers/operator.controller.js"></script>
  <script src="/js/controllers/invoices.controller.js"></script>

  <!-- 6. SPA Router & App Bootstrapper -->
  <script src="/js/router.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
