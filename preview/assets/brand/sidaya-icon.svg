<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Warm Blue to Orchid Gradient -->
    <linearGradient id="sdPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#828DF8"/>
      <stop offset="50%" stop-color="#5048E5"/>
      <stop offset="100%" stop-color="#3660FF"/>
    </linearGradient>
    <!-- Fennel Fiesta to Envy's Love Gradient -->
    <linearGradient id="sdGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B77F"/>
      <stop offset="100%" stop-color="#36D399"/>
    </linearGradient>
    <filter id="sdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="120" height="120" rx="28" fill="#090D1B" stroke="#262E4B" stroke-width="2"/>

  <!-- S-D Intertwining Ribbon Monogram (Affinity Design Vector Match) -->
  <g transform="translate(14, 14)">
    <!-- Outer "D" Purple Loop Ribbon -->
    <path d="M 22 10 
             C 45 10, 72 10, 78 26 
             C 84 42, 84 62, 70 76 
             C 58 88, 38 88, 22 84 
             C 14 82, 10 74, 16 66 
             C 24 56, 38 56, 48 64 
             C 56 70, 64 68, 68 58 
             C 72 48, 68 30, 52 24 
             C 38 18, 22 24, 22 24 Z" 
          fill="none" 
          stroke="url(#sdPurpleGrad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner "S" Green Intersecting Growth Ribbon -->
    <path d="M 18 72 
             C 10 60, 20 46, 32 40 
             C 44 34, 56 40, 56 50 
             C 56 62, 42 70, 30 72 
             C 20 74, 14 66, 18 56" 
          fill="none" 
          stroke="url(#sdGreenGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
