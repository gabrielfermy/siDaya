<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#828DF8"/>
      <stop offset="50%" stop-color="#5048E5"/>
      <stop offset="100%" stop-color="#3660FF"/>
    </linearGradient>
    <linearGradient id="logoGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B77F"/>
      <stop offset="100%" stop-color="#36D399"/>
    </linearGradient>
  </defs>

  <!-- ICON MONOGRAM (LEFT) -->
  <g transform="translate(6, 6)">
    <rect width="88" height="88" rx="22" fill="#090D1B" stroke="#262E4B" stroke-width="1.5"/>
    <g transform="translate(6, 6) scale(0.8)">
      <!-- Outer D Loop -->
      <path d="M 22 10 C 45 10, 72 10, 78 26 C 84 42, 84 62, 70 76 C 58 88, 38 88, 22 84 C 14 82, 10 74, 16 66 C 24 56, 38 56, 48 64 C 56 70, 64 68, 68 58 C 72 48, 68 30, 52 24 C 38 18, 22 24, 22 24 Z" 
            fill="none" stroke="url(#logoPurpleGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Inner S Loop -->
      <path d="M 18 72 C 10 60, 20 46, 32 40 C 44 34, 56 40, 56 50 C 56 62, 42 70, 30 72 C 20 74, 14 66, 18 56" 
            fill="none" stroke="url(#logoGreenGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- WORDMARK: s i D aya -->
  <g transform="translate(112, 16)">
    <!-- 's' -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F8FAFC" letter-spacing="-1">s</text>
    
    <!-- 'i' with Green Dot & Stem -->
    <g transform="translate(24, 0)">
      <circle cx="10" cy="8" r="6.5" fill="url(#logoGreenGrad)"/>
      <rect x="5" y="20" width="10" height="24" rx="4" fill="url(#logoGreenGrad)"/>
    </g>

    <!-- 'D' in Warm Blue / Royal Purple -->
    <text x="50" y="46" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="54" font-weight="900" fill="url(#logoPurpleGrad)" letter-spacing="-1">D</text>

    <!-- 'aya' in Bold Modern Geometry -->
    <text x="96" y="44" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F8FAFC" letter-spacing="-1">aya</text>

    <!-- Subtitle: By Ashvin Labs Idn -->
    <g transform="translate(0, 64)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#10B77F" letter-spacing="0.8">By</text>
      <text x="24" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#CBD5E1" letter-spacing="0.8">Ashvin Labs Idn</text>
    </g>
  </g>
</svg>
