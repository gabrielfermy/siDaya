#:schema ../../node_modules/wrangler/config-schema.json
name = "sidaya-paylink-web"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Default Staging Environment (pay.sidaya.my.id)
[vars]
ENVIRONMENT = "staging"
PUBLIC_API_URL = "https://api.sidaya.my.id/api/v1/public/paylink"

# Staging Environment
[env.staging]
name = "sidaya-paylink-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
PUBLIC_API_URL = "https://api.sidaya.my.id/api/v1/public/paylink"

# Production Environment (pay.sidaya.biz.id)
[env.production]
name = "sidaya-paylink-production"
[env.production.vars]
ENVIRONMENT = "production"
PUBLIC_API_URL = "https://api.sidaya.biz.id/api/v1/public/paylink"
